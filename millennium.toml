[plugin]
id = "steam-nexus"
name = "Steam Nexus"
version = "0.1.0"
author = "Steam Nexus contributors"
description = "Modular Steam desktop enhancements. Drive Indicators development preview."

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
output_path = "dist/steam-nexus.star"

[dev]
auto_restart = true
reload_steamui_when = "both"
